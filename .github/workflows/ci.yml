name: CI

on:
  pull_request: ~
  push:
    branches:
      - '*'
    tags:
      - '*'

jobs:
  cs:
    name: Coding Style
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Checkout
        uses: actions/checkout@v2

      - name: Install ecs
        run: cd tools/ecs && composer update --no-interaction --no-suggest

      - name: Run the CS fixer
        run: composer cs-fixer

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install the dependencies
        run: |
          composer update --no-interaction --no-progress
          cd tools/phpstan && composer update --no-interaction --no-suggest
      - name: Run PHPStan
        run: composer phpstan

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3,8.4,8.5 ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Checkout
        uses: actions/checkout@v2

      - name: Install phpunit
        run: cd tools/phpunit && composer update --no-interaction --no-suggest

      - name: Install the dependencies
        run: composer update --no-interaction --no-suggest

      - name: Run the unit tests
        run: composer unit-tests

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib

      # MySQL is installed on the runner (user root, password root), as in the workflows of Contao
      - name: Initialize the database
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE rbb_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install phpunit
        run: cd tools/phpunit && composer update --no-interaction --no-suggest

      - name: Install the dependencies
        run: composer update --no-interaction --no-suggest

      - name: Run the integration tests
        run: composer unit-tests -- --testsuite integration
        env:
          RBB_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/rbb_test

  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the JavaScript tests
        run: npm test

      - name: Build the assets
        run: npm run build
