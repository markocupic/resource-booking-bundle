services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Markocupic\ResourceBookingBundle\:
        resource: ../src/
        exclude:
            - '../src/{DependencyInjection,Session,Config,Model,Event,Exception,Widget}'
            - '../src/Response/AjaxResponse.php'
            - '../src/AppState/AppState.php'
            - '../src/Api/{AccessToken,ApiContext,InvalidAccessTokenException}.php'
            - '../src/Booking/BookingSource.php'
            - '../src/Slot/{Slot,SlotCollection}.php'
            - '../src/Util/BlockedSlots.php'
            - '../src/Validator/InvalidBookingRequestException.php'
