services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Markocupic\ResourceBookingBundle\:
        resource: ../src/
        exclude:
            - '../src/{DependencyInjection,Session,Config,Model,Event,Exception,Widget}'
            - '../src/Response/{AjaxResponse,AjaxStatus,MessageType}.php'
            - '../src/AppState/{AppConfig,AppState}.php'
            - '../src/Api/{AccessToken,ApiContext,InvalidAccessTokenException}.php'
            - '../src/Api/{Input,Output}'
            - '../src/Booking/{BookingSource,CancellationRules}.php'
            - '../src/Slot/{Slot,SlotCollection}.php'
            - '../src/Restriction'
            - '../src/Util/{BlockedSlots,CsvList,DateHelper,TimeOfDay}.php'
            - '../src/Validator/InvalidBookingRequestException.php'
